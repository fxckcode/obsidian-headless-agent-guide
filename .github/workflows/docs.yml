name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md"
      - name: Check links
        run: |
          find . -name '*.md' -not -path './.git/*' -print0 \
            | xargs -0 -n1 npx --yes markdown-link-check --quiet --retry
